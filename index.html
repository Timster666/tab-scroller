:root{
  --ink:#1b1f24; --panel:#23282e; --panel2:#2b3138; --line:#3a424b;
  --chalk:#ebe7dd; --mute:#8f98a2; --dash:#5a636d;
  --green:#4fcf85; --greenbg:rgba(79,207,133,.20);
  --amber:#f0bf4c; --amberbg:rgba(240,191,76,.40);
  --steel:#86b0dc; --red:#e0705f;
  --mono: "Tab Mono",ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cw:2.4ch;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--chalk);font:14px/1.45 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--steel);color:#0f1720;border-color:transparent;font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger:hover{color:var(--red);border-color:var(--red)}
button.icon{padding:4px 9px}
button.link{background:none;border:none;padding:0;color:var(--steel);text-decoration:underline;text-underline-offset:2px}
button.wide{width:100%}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:230px 1fr;height:100%}
#sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 4px;font-weight:700;font-size:16px;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.folder{display:flex;align-items:baseline;gap:8px;font-size:13px}
.fname{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fname::before{content:"Folder: ";color:var(--dash)}
.note{color:var(--mute);font-size:12px;margin:0}
.sideacts{display:flex;gap:6px;padding:4px 16px 10px}
.sideacts button{flex:1}
#songList{list-style:none;margin:0;padding:6px 8px 16px;overflow:auto;flex:1;border-top:1px solid var(--line)}
#songList li.none{color:var(--mute);padding:8px}
.songbtn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:7px 8px;white-space:normal}
.songbtn:hover{background:var(--panel2)}
li.active .songbtn{background:var(--panel2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--steel)}
.songbtn .meta{color:var(--mute);font-size:12px;white-space:nowrap}

#main{overflow:auto;min-width:0}
.songhead{position:sticky;top:0;z-index:2;background:var(--ink);border-bottom:1px solid var(--line);padding:14px 28px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.songtitle{flex:1 1 280px;min-width:0;font-size:24px;font-weight:700;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 8px;margin-left:-9px}
.songtitle:hover{border-color:var(--line)}
.songtitle:focus{border-color:var(--steel);outline:none;background:var(--panel)}
.songacts{display:flex;gap:6px;flex-wrap:wrap}
#status{flex-basis:100%;font-size:12px;color:var(--mute);min-height:1.2em}
#status[data-kind="ok"]{color:var(--green)}
#status[data-kind="warn"]{color:var(--amber)}
#status[data-kind="err"]{color:var(--red)}
.sections{padding:20px 28px 60vh;max-width:1200px}
.empty{padding:60px 28px;max-width:560px}
.empty h2{margin:0 0 8px;font-size:22px}
.empty p{color:var(--mute);margin:0 0 18px}
.empty .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Sections ---------- */
.section{border:1px solid var(--line);border-radius:8px;margin:0 0 18px;background:var(--panel)}
.section.editing{border-color:var(--steel)}
.section.flash{animation:flash 1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--steel)}to{box-shadow:0 0 0 0 transparent}}
.secbar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:8px 8px 0 0}
.time{font:600 19px/1.2 var(--mono);width:4.4em;background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 6px}
.time:hover{border-color:var(--line)}
.time:focus{border-color:var(--steel);background:var(--ink);outline:none}
.time.bad{border-color:var(--red);color:var(--red)}
.seclen{color:var(--mute);font-size:12px}
.seclen.clash{color:var(--amber)}
.grow{flex:1}
.secbody{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.section:not(.editing) .secbody{cursor:pointer}
.section:not(.editing) .secbody:hover{background:rgba(255,255,255,.02)}
.emptyblocks{color:var(--mute)}
.addblocks{display:flex;gap:8px}
.addsecrow{display:flex;gap:10px}
.addsec{flex:1;padding:12px;border-style:dashed;background:transparent;color:var(--mute)}
.addsec:hover{color:var(--chalk)}

/* ---------- Blocks ---------- */
.block.edit{border:1px dashed var(--line);border-radius:6px;padding:8px 10px 10px}
.btool{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.kind{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.btitle-in{flex:1 1 220px;min-width:120px;background:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-weight:600}
.btitle-in:focus{border-color:var(--steel);outline:none}
.cols{display:inline-flex;align-items:center;gap:4px}
.colcount{font-size:12px;color:var(--mute);min-width:4.5em;text-align:center}
.btitle{font-weight:700;margin-bottom:2px}
.textblock{font-size:21px;font-weight:600;white-space:pre-wrap;line-height:1.3}
.textblock.ph{color:var(--mute);font-weight:400;font-size:15px}
.textin{width:100%;resize:vertical;background:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:21px;font-weight:600;line-height:1.3;min-height:2.4em}
.textin:focus{border-color:var(--steel);outline:none}

/* ---------- Tab grid ---------- */
.tabwrap{overflow-x:auto;max-width:100%}
.tab{display:inline-block;font:15px/1.55 var(--mono);padding:3px 2px;border-radius:4px}
.trow{display:grid;grid-template-columns:1.8ch repeat(var(--cols),var(--cw));white-space:nowrap}
.tab.editable .trow{grid-template-columns:2.4ch 1.8ch repeat(var(--cols),var(--cw))}
.lbl{color:var(--mute)}
.xstr{padding:0;border:none;background:none;color:var(--dash);font:inherit;line-height:1;width:2ch;text-align:left}
.xstr:hover:not(:disabled){color:var(--red)}
.xstr:disabled{opacity:.25}
.cell{text-align:center;border-radius:3px}
.cell.dash{color:var(--dash)}
.tab.editable{outline:none}
.tab.editable .cell{cursor:pointer}
.tab.editable .cell:hover{background:rgba(255,255,255,.08)}
.tab.editable .cell.sel{background:var(--greenbg);color:var(--chalk)}
.tab.editable:focus .cell.sel,.tab.editable.typing .cell.sel{background:var(--green);color:#0c1a12;font-weight:700}
#updBox{position:fixed;inset:0;z-index:1000;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity .4s}
#updBox.gone{opacity:0;pointer-events:none}
#updBox .updTitle{font-size:26px;font-weight:700}
#updBox .updMsg{font-size:17px;max-width:36ch}
#updBox .updVer{font:13px var(--mono);color:var(--mute)}
#updBox .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--steel);border-radius:50%;animation:spin .9s linear infinite}
#updBox.settled .spin{visibility:hidden}
@keyframes spin{to{transform:rotate(360deg)}}
#cellInput{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
.tab.editable:focus{box-shadow:0 0 0 1px var(--line)}
.hint{font-size:12px;color:var(--mute);margin-top:4px}

/* ---------- Perform / preview ---------- */
#perform{position:fixed;inset:0;z-index:20;background:#15181b;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#perform[hidden]{display:none}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
.pbar .ptitle{font-weight:700;font-size:20px;line-height:1.2;margin:0 6px;max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pclock{font:600 20px var(--mono);min-width:7ch;text-align:center}
.pbar label{display:inline-flex;align-items:center;gap:4px;color:var(--mute)}
.pkey{color:var(--mute);font:12px var(--mono);min-width:12ch}
.pbar details{position:relative}
.pbar summary{cursor:pointer;color:var(--steel);list-style:none;padding:4px 6px}
.pbar summary::-webkit-details-marker{display:none}
.keys{position:absolute;right:0;top:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:300px;z-index:3;line-height:1.7}
.keys kbd{font:12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--ink)}
.pstage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:12px}
.pframe{flex:none;background:var(--pbg);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
#perform:fullscreen .pstage{padding:0}
#perform:fullscreen .pframe{border:none;border-radius:0}
#perform{--pfg:#f1eee6;--pbg:#0f1214;--ptime:#8f98a2;--ptitle:.8;--ptext:1.35;--pactive:#1c382b;--pwarn:#69572a;--pdash:#656664}
#perform.live .nolive{display:none}
/* live bar order: Title (2 / 5) - Timer, then Play */
#perform.live .pbar > *{order:2}
#perform.live #pTitle,#perform.live #pClock{order:0}
#perform.live #pPlay{order:1;margin-left:8px;min-width:5.5em}
/* live: top bar shows the state at a glance: dark red = idle, dark green = running (pulses 3 times on start) */
#perform.live .pbar{background:#5c1f1b;border-bottom-color:#7a2a24;transition:background-color .2s}
#perform.live.playing .pbar{background:#1c4a2e;border-bottom-color:#2a6a42;animation:livePulse .45s ease-in-out 6 alternate}
@keyframes livePulse{from{background-color:#1c4a2e}to{background-color:#2f8f55}}
#pContent{position:relative;padding:.6em 0 0;will-change:transform}
/* sections run edge to edge in the preview / live player; the settings samples keep their rounded look */
#pContent .psec{padding-left:.3ch;padding-right:.3ch;border-radius:0}
#pContent .psec.current{padding-left:calc(.3ch + 5px)}
.pview{color:var(--pfg)}
.psec{padding:.45em 1ch .6em;border-radius:.3em;margin-bottom:.35em;cursor:pointer;transition:background-color .3s}
.psec.current{background:var(--pactive);color:var(--pafg)}
.psec.current .ptime{color:var(--patime)}
.psec.current .cell.dash{color:var(--padash)}
.psec.current .lbl{color:color-mix(in srgb,var(--pafg) 55%,var(--pactive))}
.psec.warn{background-color:var(--pwarn);animation:warn var(--pwarnDur,3s) ease-in-out 1 both}
.sample .psec.warn{animation-iteration-count:infinite}
/* fast fade in, then two slow, smooth pulses down to a see-through version (spread over the warning time) */
@keyframes warn{
  0%{background-color:transparent}
  8%{background-color:var(--pwarn)}
  30%{background-color:color-mix(in srgb,var(--pwarn) 35%,transparent)}
  52%{background-color:var(--pwarn)}
  74%{background-color:color-mix(in srgb,var(--pwarn) 35%,transparent)}
  96%,100%{background-color:var(--pwarn)}
}
.ptime{font:600 .62em var(--mono);color:var(--ptime);margin-bottom:.2em}
button.ptime{display:inline-block;background:none;border:none;padding:0 .25em;margin-left:-.25em;border-radius:.2em;cursor:text}
button.ptime:hover{background:rgba(255,255,255,.1);text-decoration:underline dotted}
.ptedit{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:.2em;min-height:22px}
.phead .ptime{margin-bottom:0}
.pact{font:12px/1.2 var(--sans);padding:2px 9px;opacity:.5}
.psec:hover .pact,.pact:focus-visible{opacity:1}
.ptinput{font:600 15px var(--mono);width:5.2em;background:var(--ink);color:var(--chalk);border:1px solid var(--steel);border-radius:4px;padding:2px 6px}
.ptinput.bad{border-color:var(--red);color:var(--red)}
.ptnow{padding:2px 9px;font-size:13px}
.ptrack{color:var(--mute);font-size:12px;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psec .pblock + .pblock,.psec .pblock + .textblock,.psec .textblock + .pblock,.psec .textblock + .textblock{margin-top:.5em}
.psec .tab{font-size:1em;line-height:1.42;padding:0}
.boldnotes .psec .cell:not(.dash){font-weight:700}
.psec .btitle + .tab{margin-top:var(--ptabgap,0px)}
.nolabels .psec .lbl{display:none}
/* no string numbers: pull the lines left so a one-digit note or dash in the first spot lines up with the title */
.nolabels .psec .trow{grid-template-columns:repeat(var(--cols),var(--cw));margin-left:calc((var(--cw) - 1ch) / -2)}
.psec .lbl{color:color-mix(in srgb,var(--pfg) 55%,var(--pbg))}
.psec .cell.dash{color:var(--pdash)}
.psec .btitle{font-size:calc(var(--ptitle) * 1em)}
.psec .textblock{font-size:calc(var(--ptext) * 1em)}

/* ---------- Settings ---------- */
.sidefoot{padding:10px 16px;border-top:1px solid var(--line)}
.liverow{padding:0 16px 12px}
#liveBtn,#pedalBtn{padding:14px 11px;font-size:17px}
#liveBtn,#pedalBtn{min-height:54px}
#pedalBtn{margin-bottom:10px;color:#fff;font-weight:600;font-size:14px;white-space:normal;padding-left:6px;padding-right:6px}
.samples .sample{font-size:12px;overflow:hidden}
.samples > div{min-width:0}
#pedalBtn.poff{background:#7c2b25;border-color:#c9483c;animation:pedalPulse 1.4s ease-in-out infinite alternate}
#pedalBtn.pon{background:#1e7443;border-color:#2fa864}
@keyframes pedalPulse{from{opacity:1}to{opacity:.55}}
.psec.selected{box-shadow:inset 0 0 0 3px var(--psel)}
.pframe{touch-action:none}
.ctable{display:grid;grid-template-columns:250px 150px 150px;align-items:center;gap:8px 12px;margin:14px 0 4px}
.ctable .ch{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.ctable input[type=color]{width:46px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--ink);cursor:pointer;vertical-align:middle}
.ctable .hex{font:12px var(--mono);color:var(--mute);margin-left:6px}
.samples{display:flex;gap:16px;flex-wrap:wrap}
.samples > div{flex:1 1 300px;max-width:430px}
.samples .sample{max-width:none}
.samplelabel{font-size:12px;color:var(--mute);margin-bottom:6px}
.sgroup{margin:26px 0 4px;font-weight:700;font-size:15px}
.fname2{font:13px var(--mono);color:var(--chalk)}
.steps{line-height:1.7;padding-left:20px;max-width:64ch;margin:14px 0}
.pedalrow{display:flex;gap:14px;margin:18px 0;flex-wrap:wrap}
.pkeybox{flex:1 1 200px;max-width:260px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);transition:background-color .15s}
.pkeybox.learn{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.pkeybox.hit{background:var(--green)}
.pkeybox.hit *{color:#0c1a12 !important}
.pkl,.pkd{font-size:12px;color:var(--mute)}
.pkv{font:600 18px var(--mono);margin:6px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
#songList li{position:relative}
#songList li.dragging{opacity:.4}
#songList li.drop-before::before,#songList li.drop-after::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--steel);border-radius:2px}
#songList li.drop-before::before{top:-1px}
#songList li.drop-after::after{bottom:-1px}
.songbtn .num{color:var(--dash);font:12px var(--mono);min-width:2.2ch;padding-top:2px}
.songbtn .stitle{flex:1}
.songbtn{cursor:grab}
.ptitle .pos{margin-left:8px}
.sidefoot button.on{border-color:var(--steel);box-shadow:inset 3px 0 0 var(--steel)}
.settings{padding:24px 28px 80px;max-width:780px}
.settings h2{margin:0 0 4px;font-size:24px}
.settings .lead{color:var(--mute);margin:0 0 6px;max-width:62ch}
.srow{display:grid;grid-template-columns:250px 1fr;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.srow input[type=range]{flex:1;max-width:280px;accent-color:var(--steel)}
.srow input[type=number]{width:5em;background:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.srow input[type=color]{width:46px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--ink);cursor:pointer}
.sval{font:13px var(--mono);color:var(--mute)}
.sunit{color:var(--mute)}
.sampletitle{margin:26px 0 8px;font-weight:600}
.sample{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:17px;background:var(--pbg);max-width:560px}
.settings .reset{margin-top:18px}
.pempty{color:var(--mute);padding:1em}
@media (prefers-reduced-motion:reduce){
  .section.flash{animation:none}
}
</style>

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Tab Scroller<small>Song editor</small></div>
    <div class="sideacts">
      <button id="newSongBtn">New song</button>
      <button id="importBtn" title="Import song files, the setlist file and the settings file (you can select them all at once)">Import</button>
      <input id="importInput" type="file" accept=".json,application/json" multiple hidden>
    </div>
    <div class="liverow"><button id="liveBtn" class="primary wide" title="Play the list from the selected song (drag songs to change the order)">▶ Live</button></div>
    <ul id="songList"></ul>
    <div class="sidefoot"><button id="pedalBtn" class="wide poff" title="Foot pedal setup">● Pedal not connected</button><button id="settingsBtn" class="wide">Settings</button></div>
  </aside>
  <main id="main"></main>
</div>

<div id="perform" hidden>
  <div class="pbar">
    <span class="ptitle" id="pTitle"></span>
    <button id="pRestart" class="icon nolive" title="Back to 00:00 (Home)">⏮</button>
    <button id="pBack" class="icon nolive" title="Back 5 seconds (←)">−5s</button>
    <button id="pPlay" class="primary" title="Play / pause (Space)">Play</button>
    <button id="pFwd" class="icon nolive" title="Forward 5 seconds (→)">+5s</button>
    <span class="pclock" id="pClock">00:00.0</span>
    <span class="grow"></span>
    <label class="nolive">Warn <select id="pWarn"></select> s</label>
    <label>Screen <select id="pFrameSel">
      <option value="r34">Tablet portrait 3:4 (iPad)</option>
      <option value="r1016">Tablet portrait 10:16</option>
      <option value="r43">Tablet landscape 4:3 (iPad)</option>
      <option value="r1610">Tablet landscape 16:10</option>
      <option value="fill">Fill window</option>
    </select></label>

  </div>
  <div class="pstage"><div class="pframe" id="pFrame"><div id="pContent" class="pview"></div></div></div>
</div>

<script>
'use strict';
/* ================= Basics ================= */
const LABELS = ['1','2','3','4','5','6']; // top line = string 1 (thin E), bottom = string 6
const FRAMES = { r34: 3 / 4, r1016: 10 / 16, r43: 4 / 3, r1610: 16 / 10, fill: 0 };
const SETTINGS_FILE = '_tab-scroller-settings.json';
const SETLIST_FILE = '_tab-scroller-setlist.json';
const THEME_KEYS = ['fg', 'bg', 'timeColor', 'dashColor', 'activeFg', 'activeBg', 'activeTime', 'activeDash', 'warnBg'];
const DEFAULT_SETTINGS = {
  titleScale: 80, textScale: 135, showStrings: true, boldNotes: false, autoFS: true, tabGap: 0, hold: 10, warn: 3, frame: 'r34', mute: false, theme: 'dark',
  dark:  { fg: '#f1eee6', bg: '#0f1214', timeColor: '#8f98a2', dashColor: '#656664', activeFg: '#f1eee6', activeBg: '#1c382b', activeTime: '#8f98a2', activeDash: '#656664', warnBg: '#69572a' },
  light: { fg: '#1d2126', bg: '#f7f5f0', timeColor: '#6b7280', dashColor: '#b8b4aa', activeFg: '#1d2126', activeBg: '#cdecd9', activeTime: '#6b7280', activeDash: '#b8b4aa', warnBg: '#f3d27a' },
  pedalLeft: 'ArrowLeft', pedalRight: 'ArrowRight'
};
const APP_VERSION = '2026-10-05 (auto fullscreen)';
const DEFAULT_COLS = 40, MIN_COLS = 4, MAX_COLS = 200;
const FORMAT = 'tab-scroller-song';
const $ = (sel, root = document) => root.querySelector(sel);
const uid = () => Math.random().toString(36).slice(2, 10);
const deep = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

/* ================= Time ================= */
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}
function fmtClock(t) {
  t = Math.max(0, t);
  const m = Math.floor(t / 60), r = t - m * 60;
  return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0');
}
function parseTime(str) {
  str = String(str).trim();
  let m = str.match(/^(\d+)[:.](\d{1,2})$/);
  if (m) { const s = +m[2]; return s > 59 ? null : +m[1] * 60 + s; }
  if (/^\d+$/.test(str)) return +str;
  return null;
}

/* ================= Model ================= */
function mkTab(cols = DEFAULT_COLS) {
  return { id: uid(), type: 'tab', title: '', labels: [...LABELS], cols, strings: LABELS.map(() => Array(cols).fill('')) };
}
function mkText() { return { id: uid(), type: 'text', text: '' }; }
function mkSection(time, type = 'tab', cols = DEFAULT_COLS) { return { id: uid(), time, blocks: [type === 'text' ? mkText() : mkTab(cols)] }; }
function mkSong(title) { return { id: uid(), title, sections: [mkSection(0)], _file: null }; }
function reId(sec) { const s = deep(sec); s.id = uid(); s.blocks.forEach(b => b.id = uid()); return s; }
function sortSecs(song) { song.sections.sort((a, b) => a.time - b.time); }
function maxTime(song) { return song.sections.reduce((m, s) => Math.max(m, s.time), -1); }

function fromFile(o) {
  const song = { id: uid(), title: String(o.title || 'Untitled'), sections: [], _file: null };
  for (const s of (Array.isArray(o.sections) ? o.sections : [])) {
    const sec = { id: uid(), time: Math.max(0, Math.round(+s.time || 0)), blocks: [] };
    for (const b of (Array.isArray(s.blocks) ? s.blocks : [])) {
      if (b.type === 'text') { sec.blocks.push({ id: uid(), type: 'text', text: String(b.text || '') }); continue; }
      const cols = clamp(Math.round(+b.cols || (b.strings && b.strings[0] && b.strings[0].length) || DEFAULT_COLS), MIN_COLS, MAX_COLS);
      let labels = Array.isArray(b.labels) && b.labels.length >= 1 && b.labels.length <= 6 ? b.labels.map(String) : [...LABELS];
      // files from the earlier version numbered the lines 6..1 from the top; renumber them 1..6
      if (labels.length > 1 && labels.every((l, i) => i === 0 || +l === +labels[i - 1] - 1)) labels = labels.map(l => String(7 - +l));
      const strings = labels.map((_, i) => {
        const row = Array.isArray(b.strings && b.strings[i]) ? b.strings[i] : [];
        return Array.from({ length: cols }, (_, c) => row[c] == null ? '' : String(row[c]).replace(/[^0-9]/g, '').slice(0, 2));
      });
      sec.blocks.push({ id: uid(), type: 'tab', title: String(b.title || ''), labels, cols, strings });
    }
    song.sections.push(sec);
  }
  sortSecs(song);

/* ================= State ================= */
const S = {

/* ================= Undo ================= */

/* ================= Files (folder on disk) ================= */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tab-scroller', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) { const db = await idb(); return new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }

function safeName(title) {
  return (title || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Untitled';
}
function fileNameFor(song) {
  const base = safeName(song.title);
  let n = base + '.json';
  if (song._file && song._file.toLowerCase() === n.toLowerCase()) return song._file;
  const taken = new Set(S.songs.filter(s => s !== song && s._file).map(s => s._file.toLowerCase()));
  taken.add(SETTINGS_FILE.toLowerCase()); taken.add(SETLIST_FILE.toLowerCase());
  let i = 2;
  while (taken.has(n.toLowerCase())) {
    n = `${base} (${i++}).json`;
    if (song._file && song._file.toLowerCase() === n.toLowerCase()) return song._file;
  }
  return n;
}

function markDirty(song) {
  clearTimeout(S.timers[song.id]);
  if (S.local) { saveLocalSoon(); return; }
  if (!S.dir) { setStatus('Not saved: choose a songs folder first', 'warn'); return; }
  setStatus('Saving…');

}
let saveChain = Promise.resolve();
function saveSong(song) { saveChain = saveChain.then(() => doSave(song)); return saveChain; }
async function doSave(song) {
  if (!S.dir || !S.songs.includes(song)) return;
  const name = fileNameFor(song);
  try {
    const fh = await S.dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(serialize(song));
    await w.close();
    const old = song._file; song._file = name;
    if (old && old !== name) { try { await S.dir.removeEntry(old); } catch (e) { /* already gone */ } }
    if (old !== name) saveSetlist();
    setStatus('Saved to ' + name, 'ok');
  } catch (e) {
    console.error(e);
    setStatus('Save failed: ' + e.message, 'err');
  }
}

// Put the songs in setlist order (a list of file names); songs not in the list go last, alphabetically
function orderSongs(order) {
  const pos = new Map((Array.isArray(order) ? order : []).map((n, i) => [String(n).toLowerCase(), i]));
  S.songs.sort((a, b) => {
    const pa = a._file ? pos.get(a._file.toLowerCase()) : undefined, pb = b._file ? pos.get(b._file.toLowerCase()) : undefined;
    if (pa != null && pb != null) return pa - pb;
    if (pa != null) return -1;
    if (pb != null) return 1;
    return a.title.localeCompare(b.title, undefined, { sensitivity: 'base', numeric: true });

/* ---------- device storage (tablet) ---------- */
let localTimer = 0, localQuiet = false;
function saveLocalSoon() {

      S.songs.forEach(s => { if (!s._file) s._file = fileNameFor(s); });
      await kvSet('library', { version: 1, songs: S.songs.map(s => ({ file: s._file, data: toFile(s) })), settings: S.settings });
      if (!localQuiet) setStatus('Saved on this device', 'ok');

async function loadLocal() {

  let lib = null;

  if (lib) {
    S.settings = cleanSettings(lib.settings);
    S.songs = (lib.songs || []).map(x => { const s = fromFile(x.data); s._file = x.file; return s; });
  } else S.settings.frame = 'fill';       // on the tablet, use the whole screen by default
  S.curId = S.songs[0]?.id ?? null;

async function initFolder() {

  if (S.fsOK) {

      if (hnd) {

        S.pendingDir = hnd;

async function pickFolder() {

    await openDir(hnd);
  } catch (e) { if (e.name !== 'AbortError') alert('Could not open that folder: ' + e.message); }
}

  catch (e) { alert('Could not reopen the folder: ' + e.message); }

async function openDir(hnd) {

  await saveChain;
  S.dir = hnd; S.pendingDir = null;
  try { await kvSet('dir', hnd); } catch (e) { /* remembering is optional */ }
  S.songs = [];
  for await (const entry of hnd.values()) {
    if (entry.kind !== 'file' || !/\.json$/i.test(entry.name) || entry.name === SETTINGS_FILE || entry.name === SETLIST_FILE) continue;

/* ================= Settings ================= */
function cleanSettings(o) {
  const d = DEFAULT_SETTINGS, s = deep(d);
  if (!o || typeof o !== 'object') return s;
  const num = (v, a, b, def) => (v !== '' && v != null && Number.isFinite(+v)) ? clamp(+v, a, b) : def;
  const col = (v, def) => /^#[0-9a-f]{6}$/i.test(v) ? v : def;
  s.titleScale = num(o.titleScale, 40, 250, d.titleScale);
  s.textScale = num(o.textScale, 50, 300, d.textScale);
  for (const th of ['dark', 'light']) {
    // older settings files kept the (dark) colors at the top level
    const src = (o[th] && typeof o[th] === 'object') ? o[th] : (th === 'dark' ? o : {});
    for (const k of THEME_KEYS) s[th][k] = col(src[k], d[th][k]);
    // settings saved before the active-section colors existed: start them equal to the normal ones
    if (!src.activeFg) s[th].activeFg = s[th].fg;
    if (!src.activeTime) s[th].activeTime = s[th].timeColor;
    if (!src.activeDash) s[th].activeDash = s[th].dashColor;
  }
  s.theme = o.theme === 'light' ? 'light' : 'dark';
  s.showStrings = o.showStrings !== false;
  s.boldNotes = o.boldNotes === true;
  s.autoFS = o.autoFS !== false;
  s.tabGap = num(o.tabGap, 0, 60, d.tabGap);
  s.hold = num(o.hold, 0, 60, d.hold); s.warn = num(o.warn, 1, 10, d.warn);
  s.frame = Object.prototype.hasOwnProperty.call(FRAMES, o.frame) ? o.frame : d.frame;
  s.mute = o.mute === true;
  s.pedalLeft = typeof o.pedalLeft === 'string' && o.pedalLeft ? o.pedalLeft : d.pedalLeft;
  s.pedalRight = typeof o.pedalRight === 'string' && o.pedalRight ? o.pedalRight : d.pedalRight;
  return s;
}
function applySettings(el, theme = S.settings.theme) {
  if (!el) return;
  const s = S.settings, c = s[theme];
  el.style.setProperty('--pfg', c.fg); el.style.setProperty('--pbg', c.bg); el.style.setProperty('--ptime', c.timeColor);
  el.style.setProperty('--pactive', c.activeBg); el.style.setProperty('--pwarn', c.warnBg); el.style.setProperty('--pdash', c.dashColor);
  el.style.setProperty('--pafg', c.activeFg); el.style.setProperty('--patime', c.activeTime); el.style.setProperty('--padash', c.activeDash);
  el.style.setProperty('--psel', theme === 'dark' ? '#ffffff' : c.fg);
  el.style.setProperty('--ptitle', s.titleScale / 100); el.style.setProperty('--ptext', s.textScale / 100);
  el.style.setProperty('--pwarnDur', s.warn + 's');
  el.classList.toggle('nolabels', !s.showStrings);
  el.classList.toggle('boldnotes', s.boldNotes);

}
let settingsTimer = 0;

        const w = await fh.createWritable();

/* ================= Song actions ================= */
const sortedSongs = () => S.songs.slice(); // the list order is the setlist order

  if (!S.dir) return;

    saveChain = saveChain.then(async () => {
      try {
        const fh = await S.dir.getFileHandle(SETLIST_FILE, { create: true });
        const w = await fh.createWritable();

  S.songs.splice(from, 1);

  S.songs.splice(clamp(to, 0, S.songs.length), 0, song);
  saveSetlist(); renderSidebar();
}
function uniqueTitle(base) {

  let t = base, i = 2;
  while (titles.has(t.toLowerCase())) t = `${base} ${i++}`;
  return t;
}

  S.editSec = editFirst && song.sections[0] ? song.sections[0].id : null;

async function delSong(song) {

  clearTimeout(S.timers[song.id]);

// Import any mix of song files, the setlist file and the settings file (e.g. a whole Songs folder at once)
async function importFiles(files) {
  const songsIn = [], errors = [];
  let setlist = null, settings = null;
  for (const f of files) {
    try {
      const o = JSON.parse(await f.text());
      if (o && Array.isArray(o.sections)) songsIn.push([f.name, o]);
      else if (o && (o.format === 'tab-scroller-setlist' || Array.isArray(o.songs))) setlist = o.songs;
      else if (o && (o.format === 'tab-scroller-settings' || f.name === SETTINGS_FILE)) settings = o;
      else throw new Error('not a Tab Scroller file');
    } catch (e) { errors.push(`${f.name} (${e.message})`); }
  }
  let added = 0, replaced = 0;
  for (const [name, o] of songsIn) {
    const song = fromFile(o);
    const i = S.songs.findIndex(x => x._file && x._file.toLowerCase() === name.toLowerCase());
    if (i >= 0) {                                   // same file name: replace, keep its place in the list
      const old = S.songs[i];
      song._file = old._file;
      if (S.curId === old.id) S.curId = song.id;
      delete S.undo[old.id];
      S.songs[i] = song; replaced++;
    } else {
      song._file = S.local ? name : null;
      S.songs.push(song); added++;
    }
    if (!S.local) markDirty(song);
  }
  if (setlist) { orderSongs(setlist); saveSetlist(); }
  if (settings) {
    // pedal keys, screen shape and mute belong to the device, so keep this device's own
    const keep = { pedalLeft: S.settings.pedalLeft, pedalRight: S.settings.pedalRight, frame: S.settings.frame, mute: S.settings.mute, autoFS: S.settings.autoFS };
    S.settings = Object.assign(cleanSettings(settings), keep);
    saveSettings(); applySettings($('#perform'));
  }
  if (S.local) { saveLocalSoon(); localQuiet = true; }
  if (!cur()) S.curId = S.songs[0]?.id ?? null;
  S.editSec = null; S.sel = null;
  render();
  const parts = [];
  if (added) parts.push(`${added} new song${added === 1 ? '' : 's'}`);
  if (replaced) parts.push(`${replaced} updated song${replaced === 1 ? '' : 's'}`);
  if (setlist) parts.push('song order');
  if (settings) parts.push('settings');
  setStatus(parts.length ? 'Imported ' + parts.join(', ') : 'Nothing imported', parts.length ? 'ok' : 'warn');
  if (errors.length) alert('These files could not be imported:\n' + errors.join('\n'));
}

/* ================= Section actions ================= */

/* ================= Block actions ================= */

function delBlock(song, sec, i) {

const selIn = b => S.sel && S.sel.blockId === b.id;

/* ================= Tab grid ================= */
function tabGrid(b, editable, song) {
  const g = h('div', { class: 'tab' + (editable ? ' editable' : ''), 'data-block': b.id });
  g.style.setProperty('--cols', b.cols);
  g._off = editable ? 2 : 1;            // children before the first cell in each row
  const rows = b.strings.length;
  for (let s = 0; s < rows; s++) {
    const row = h('div', { class: 'trow' });
    if (editable) row.append(h('button', {
      class: 'xstr', tabindex: '-1', disabled: rows <= 1,
      title: rows > 1 ? 'Remove this string line' : 'A tab needs at least one string line',
      onclick: () => removeString(song, b, s)
    }, '×'));
    row.append(h('span', { class: 'lbl' }, stringName(b.labels[s])));
    for (let c = 0; c < b.cols; c++) {
      const v = b.strings[s][c];
      const sel = editable && selIn(b) && S.sel.s === s && S.sel.c === c;
      row.append(h('span', { class: 'cell' + (v ? '' : ' dash') + (sel ? ' sel' : ''), 'data-s': s, 'data-c': c }, v || '-'));
    }
    g.append(row);
  }
  if (editable) {
    g.tabIndex = 0;
    g.addEventListener('pointerdown', e => { lastPointer = e.pointerType; });
    g.addEventListener('mousedown', e => {
      const cell = e.target.closest('.cell'); if (!cell) return;
      e.preventDefault();
      selectCell(g, b, +cell.dataset.s, +cell.dataset.c);
      if (lastPointer !== 'touch' && lastPointer !== 'pen') g.focus({ preventScroll: true });
    });
    // on a touch screen, typing goes through a hidden text field so the on-screen keyboard appears
    g.addEventListener('click', e => {
      if ((lastPointer === 'touch' || lastPointer === 'pen') && e.target.closest('.cell') && selIn(b)) startCellInput(b.id);
    });
    g.addEventListener('keydown', e => gridKey(e, g, b, song));
  }
  return g;
}
// Stored labels are 1 = thin E (top line) … 6 = thick E (bottom line); on screen they're shown
// the other way round, so the bottom line reads 1 and the top line reads 6.
const stringName = l => /^[1-6]$/.test(l) ? String(7 - +l) : l;
/* ---------- typing frets with the on-screen keyboard (tablet) ---------- */
let lastPointer = 'mouse';
const CI = { blockId: null };
const cellInput = h('input', { id: 'cellInput', type: 'text', inputmode: 'numeric', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Fret number' });
document.body.append(cellInput);
function ciBlock() {
  const song = cur(); if (!song || !CI.blockId) return null;
  for (const sec of song.sections) for (const b of sec.blocks) if (b.id === CI.blockId) return b;
  return null;
}
const ciGrid = () => CI.blockId ? $(`.tab.editable[data-block="${CI.blockId}"]`) : null;
function resetCellInput() { cellInput.value = ' '; try { cellInput.setSelectionRange(1, 1); } catch (e) { /* ignore */ } }
function startCellInput(blockId) {
  CI.blockId = blockId;
  document.querySelectorAll('.tab.typing').forEach(x => x.classList.remove('typing'));
  ciGrid()?.classList.add('typing');
  resetCellInput();
  cellInput.focus({ preventScroll: true });
}
// feed one key to the tab grid, exactly as if it had been typed on a keyboard
function ciKey(key) {
  const g = ciGrid(), b = ciBlock();
  if (!g || !b || !selIn(b)) return;
  gridKey({ key, preventDefault() {}, ctrlKey: false, metaKey: false, altKey: false }, g, b, cur());
  ciGrid()?.classList.add('typing');       // the grid may have been redrawn
}
cellInput.addEventListener('keydown', e => {   // real keys (hardware keyboard, or keyboards that send them)
  if (/^\d$/.test(e.key) || ['Backspace', 'Delete', ' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault(); e.stopPropagation(); ciKey(e.key);
  } else if (e.key === 'Escape') { cellInput.blur(); clearSel(); }
});
cellInput.addEventListener('input', e => {      // on-screen keyboards usually only send text changes
  const v = cellInput.value;
  if ((e.inputType && e.inputType.startsWith('delete')) || v.length === 0) ciKey('Backspace');
  else for (const ch of v.slice(1)) { if (/\d/.test(ch)) ciKey(ch); else if (ch === ' ') ciKey(' '); }

});
cellInput.addEventListener('blur', () => {
  setTimeout(() => { if (document.activeElement !== cellInput) { CI.blockId = null; document.querySelectorAll('.tab.typing').forEach(x => x.classList.remove('typing')); } }, 0);
});

const cellEl = (g, s, c) => g.children[s].children[c + (g._off || 1)];
function removeString(song, b, s) {
  if (b.strings.length <= 1) return;
  change(song, () => {
    b.strings.splice(s, 1); b.labels.splice(s, 1);
    if (selIn(b)) { if (S.sel.s === s) S.sel = null; else if (S.sel.s > s) { S.sel.s--; S.refocus = true; } }
  });
}
// Space on an empty spot: everything from here to the right, on all strings, moves one step right
function shiftRight(song, b) {
  const c = S.sel.c;
  change(song, () => {
    b.strings.forEach(r => r.splice(c, 0, ''));
    if (b.strings.every(r => !r[r.length - 1])) b.strings.forEach(r => r.pop()); // keep the width if the end is empty
    else b.cols++;

  });
}
// Delete on an empty spot: everything to the right, on all strings, moves one step left
function shiftLeft(song, b) {
  const c = S.sel.c;
  if (b.strings.some(r => r[c])) { setStatus('Can’t pull left here: another string has a note in this column', 'warn'); return; }
  change(song, () => { b.strings.forEach(r => { r.splice(c, 1); r.push(''); }); S.refocus = true; });
}
function clearSel() { S.sel = null; document.querySelectorAll('.cell.sel').forEach(x => x.classList.remove('sel')); }
function selectCell(g, b, s, c) {
  clearSel();

}
function paintCell(g, b, s, c) {

}
function gridKey(e, g, b, song) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (!selIn(b)) {
    if (k.startsWith('Arrow')) { e.preventDefault(); selectCell(g, b, 0, 0); }
    return;
  }
  const sel = S.sel, v = b.strings[sel.s][sel.c];
  if (/^\d$/.test(k)) {
    e.preventDefault();
    // "1" or "2" followed by another digit makes a two-digit fret (10–29)
    const nv = (sel.pending && (v === '1' || v === '2')) ? v + k : k;
    snap(song);
    b.strings[sel.s][sel.c] = nv;
    sel.pending = nv.length === 1;
    paintCell(g, b, sel.s, sel.c); markDirty(song);
    return;
  }
  if (k === 'Backspace' || k === 'Delete') {
    e.preventDefault(); sel.pending = false;
    if (v) { snap(song); b.strings[sel.s][sel.c] = ''; paintCell(g, b, sel.s, sel.c); markDirty(song); }
    else shiftLeft(song, b);

}

/* ---------- backing track: <song file name>.wav in the songs folder ---------- */
async function loadTrack(song) {
  dropTrack();
  const label = $('#pTrack');
  label.textContent = 'No track';
  if (!S.dir || !song._file) { label.title = 'Save the song in a songs folder, then put a .wav with the same name next to it'; return; }
  const base = song._file.replace(/\.json$/i, '');
  label.title = `Put “${base}.wav” in the songs folder to play it along`;
  let file = null;
  try {
    for await (const entry of S.dir.values()) {
      if (entry.kind === 'file' && entry.name.toLowerCase() === (base + '.wav').toLowerCase()) { file = await entry.getFile(); break; }
    }
  } catch (e) { console.warn(e); }
  if (!file || !P.open || P.song !== song) return;
  const a = new Audio();
  a.preload = 'auto';
  a.muted = S.settings.mute;
  a.src = URL.createObjectURL(file);
  a.addEventListener('loadedmetadata', () => { if (P.audio !== a) return; a.currentTime = P.t; if (P.playing) a.play().catch(() => {}); });
  P.audio = a;
  label.textContent = file.name; label.title = 'Backing track: ' + file.name;
}

  if (P.lastY == null || Math.abs(P.y - P.lastY) > 0.05) { pc().style.transform = `translate3d(0,${-P.y}px,0)`; P.lastY = P.y; }
}

function setPlayBtn() { $('#pPlay').textContent = P.playing ? 'Pause' : 'Play'; $('#perform').classList.toggle('playing', P.playing); }
function play() {
  if (P.playing) return;
  P.playing = true; P.manual = 0; P.start = performance.now() - P.t * 1000;
  const a = P.audio;
  if (a && a.readyState >= 1) { a.currentTime = P.t; a.play().catch(e => { $('#pKey').textContent = 'Track: ' + e.message; }); }
  setPlayBtn();
}
function pause() { if (!P.playing) return; P.playing = false; P.audio?.pause(); setPlayBtn(); }
function togglePlay() { P.playing ? pause() : play(); }
function seek(t) {
  P.t = Math.max(0, t);
  if (P.playing) P.start = performance.now() - P.t * 1000;
  P.manual = 0;
  const a = P.audio;
  if (a && a.readyState >= 1) {
    a.currentTime = Math.min(P.t, a.duration || P.t);
    if (P.playing && a.paused && P.t < a.duration) a.play().catch(() => {});
  }
}
function nudge(d) { seek(P.t + d); }
function nextSec() { const n = curIndex(P.t) + 1; if (n < P.secs.length) seek(P.secs[n].time); }
function prevSec() {
  const c = curIndex(P.t);
  if (c >= 0 && P.t - P.secs[c].time > 1.5) seek(P.secs[c].time);
  else if (c > 0) seek(P.secs[c - 1].time);
  else seek(0);
}
/* ---------- keep the screen awake, all the time the app is open ----------
   1st choice: the Screen Wake Lock API (works when the app is opened from a web address, https).
   Fallback (e.g. opened as a local file on Android): a tiny looping video with a silent sound track,
   started on the first tap or key press, which makes Android keep the screen on as for any playing video. */
const AWAKE = { lock: null, video: null, clip: null, busy: false, mode: 'starting' };
function setAwakeMode(m) { AWAKE.mode = m; const el = $('#awakeStatus'); if (el) el.textContent = awakeText(); }
function awakeText() {
  return { lock: 'On (screen wake lock)', video: 'On (video method)', waiting: 'Waiting for the first tap…', starting: 'Starting…', none: 'Not available in this browser' }[AWAKE.mode];
}
async function keepAwake(fromGesture) {
  if (document.visibilityState !== 'visible' || AWAKE.busy) return;
  if (AWAKE.lock || (AWAKE.video && !AWAKE.video.paused)) return;
  AWAKE.busy = true;
  try {
    if ('wakeLock' in navigator) {
      try {
        AWAKE.lock = await navigator.wakeLock.request('screen');
        AWAKE.lock.addEventListener('release', () => { AWAKE.lock = null; if (document.visibilityState === 'visible') setTimeout(() => keepAwake(false), 500); });
        setAwakeMode('lock');
        return;
      } catch (e) { /* refused (often: not opened from https) */ }
    }
    if (!fromGesture) { setAwakeMode('waiting'); return; }   // the video needs a tap to start
    await startAwakeVideo();
  } finally { AWAKE.busy = false; }
}
async function makeAwakeClip() {          // records a 2-second 16×16 black video with a silent sound track
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const ctx = c.getContext('2d');
  const tracks = [...c.captureStream(10).getVideoTracks()];
  let ac = null;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
    const osc = ac.createOscillator(), gain = ac.createGain(), dest = ac.createMediaStreamDestination();
    gain.gain.value = 0; osc.connect(gain).connect(dest); osc.start();
    tracks.push(...dest.stream.getAudioTracks());
  } catch (e) { /* video only */ }
  const rec = new MediaRecorder(new MediaStream(tracks)), chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => { rec.onstop = r; });
  let n = 0; const iv = setInterval(() => { ctx.fillStyle = (n++ % 2) ? '#000' : '#020202'; ctx.fillRect(0, 0, 16, 16); }, 100);
  rec.start(); await new Promise(r => setTimeout(r, 1500)); rec.stop(); await stopped; clearInterval(iv);
  if (ac) ac.close().catch(() => {});
  return URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'video/webm' }));
}
async function startAwakeVideo() {
  try {
    if (!AWAKE.video) {
      const v = document.createElement('video');
      v.loop = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('aria-hidden', 'true'); v.title = '';
      v.style.cssText = 'position:fixed;right:0;bottom:0;width:16px;height:16px;opacity:.01;pointer-events:none;z-index:2147483647';
      // recorded clips may not report a length, so restart them by hand as well
      v.addEventListener('ended', () => { v.currentTime = 0; v.play().catch(() => {}); });
      document.body.append(v); AWAKE.video = v;
    }
    if (!AWAKE.clip) { AWAKE.clip = await makeAwakeClip(); AWAKE.video.src = AWAKE.clip; }
    const v = AWAKE.video;
    v.muted = false; v.volume = 1;          // the sound track is silent; "unmuted" makes Android treat it as real playback
    try { await v.play(); } catch (e) { v.muted = true; await v.play(); }
    setAwakeMode('video');
  } catch (e) { console.warn('Keep-awake video failed', e); setAwakeMode('none'); }
}
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else ($('#perform').requestFullscreen?.() || Promise.reject(new Error('not supported'))).catch(e => { $('#pKey').textContent = 'Fullscreen: ' + e.message; });
}

/* ================= Wiring ================= */
$('#newSongBtn').addEventListener('click', newSong);
$('#importBtn').addEventListener('click', () => $('#importInput').click());
$('#importInput').addEventListener('change', e => { importFiles([...e.target.files]); e.target.value = ''; });

$('#pClose').addEventListener('click', closePerform);
// in Live, Play starts from the selected section (if any), like the right pedal; while playing it pauses
$('#pPlay').addEventListener('click', () => { if (P.mode === 'live' && !P.playing) liveForward(); else togglePlay(); });
$('#pRestart').addEventListener('click', () => seek(0));
$('#pBack').addEventListener('click', () => nudge(-5));
$('#pFwd').addEventListener('click', () => nudge(5));
$('#pFS').addEventListener('click', toggleFS);
$('#pMute').addEventListener('click', toggleMute);
$('#pTheme').addEventListener('click', toggleTheme);
$('#pedalBtn').addEventListener('click', () => { S.view = 'pedal'; S.sel = null; S.editSec = null; render(); $('#main').scrollTop = 0; });
$('#liveBtn').addEventListener('click', startLive);
for (let i = 1; i <= 10; i++) $('#pWarn').append(h('option', { value: i }, String(i)));
$('#pWarn').addEventListener('change', e => { S.settings.warn = +e.target.value; applySettings($('#perform')); saveSettings(); e.target.blur(); });
$('#settingsBtn').addEventListener('click', () => { S.view = 'settings'; S.sel = null; S.editSec = null; render(); $('#main').scrollTop = 0; });
$('#pFrameSel').addEventListener('change', e => { S.settings.frame = e.target.value; saveSettings(); e.target.blur(); requestAnimationFrame(fitPerform); });
// buttons must not keep focus, or Space would press them again
$('#perform').addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });
pframe().addEventListener('wheel', e => { if (P.playing) return; e.preventDefault(); P.manual += e.deltaY; }, { passive: false });
let touchY = null;
pframe().addEventListener('touchstart', e => { touchY = (!P.playing && e.touches.length === 1) ? e.touches[0].clientY : null; }, { passive: true });
pframe().addEventListener('touchmove', e => {
  if (touchY == null || P.playing) return;
  const y = e.touches[0].clientY; P.manual += touchY - y; touchY = y; P.snap = true; e.preventDefault();
}, { passive: false });
pframe().addEventListener('touchend', () => { touchY = null; });

document.addEventListener('fullscreenchange', () => {
  $('#pFS').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  requestAnimationFrame(fitPerform);
});
window.addEventListener('resize', () => requestAnimationFrame(fitPerform));
// the wake lock is dropped whenever the tab is hidden; take it again when coming back
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(false); });
// any tap or key while playing/live counts as a user gesture, which some browsers need before keeping the screen on
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => {
  keepAwake(true);
}, true));

document.addEventListener('mousedown', e => {
  if (S.sel && !e.target.closest('.tab.editable, .btool')) clearSel();
});

document.addEventListener('keydown', e => {
  if (pedalKey(e)) return;
  if (P.open) {
    if (e.target.matches && e.target.matches('input')) return;
    if (e.target.matches && e.target.matches('select') && e.key !== 'Escape') return;
    const k = e.key; let handled = true;
    const act = pedalAct(k);
    if (P.mode === 'live') {
      if (act === 'right') liveForward();
      else if (act === 'left') liveBack();
      else if (k === ' ' || k === 'Enter') { if (P.playing) pause(); else liveForward(); }
      else if (k === 'ArrowDown' && !P.playing) liveScroll(1);
      else if (k === 'ArrowUp' && !P.playing) liveScroll(-1);
      else if (k === 'Escape') closePerform();
      else handled = false;
      if (handled) e.preventDefault();
      return;
    }
    if (k === ' ' || k === 'Enter') togglePlay();
    else if (act === 'right') nudge(5);
    else if (act === 'left') nudge(-5);
    else if (k === 'ArrowDown' || k === 'PageDown') nextSec();
    else if (k === 'ArrowUp' || k === 'PageUp') prevSec();
    else if (k === '.' || k === ']') nudge(0.25);
    else if (k === ',' || k === '[') nudge(-0.25);
    else if (k === 'Home') seek(0);
    else if (k === 'm' || k === 'M') toggleMute();
    else if (k === 'Escape') closePerform();
    else handled = false;
    $('#pKey').textContent = 'Key: ' + (k === ' ' ? 'Space' : k);
    if (handled) e.preventDefault();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
    if (e.target.matches && e.target.matches('input, textarea')) return; // native undo while typing
    e.preventDefault(); undo();
  }
});

window.addEventListener('beforeunload', e => {
  if (S.dir && Object.values(S.timers).length && ($('#status')?.textContent || '').startsWith('Saving')) { e.preventDefault(); e.returnValue = ''; }
});

initFolder();
keepAwake(false);
// measure the tab font again once the built-in font has loaded, so the fit to the screen width is exact
Promise.all([document.fonts.load('400 16px "Tab Mono"'), document.fonts.load('700 16px "Tab Mono"')])
  .then(() => { CH = 0; if (P.open) fitPerform(); }).catch(() => {});
// installable app: register the offline helper when the page comes from a web address (not a local file)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(e => console.warn('Service worker failed', e));
  checkForUpdate();
}

// Start-up screen: asks GitHub for the newest index.html and installs it if it's newer than this one
async function checkForUpdate() {
  const box = h('div', { id: 'updBox' },
    h('div', { class: 'updTitle' }, 'Tab Scroller'),
    h('div', { class: 'spin' }),
    h('div', { class: 'updMsg' }, 'Checking for a new version…'),
    h('div', { class: 'updVer' }, 'This version: ' + APP_VERSION));
  document.body.append(box);
  box.addEventListener('click', () => box.remove());          // tap to skip
  const msg = t => { box.querySelector('.updMsg').textContent = t; };
  const finish = (t, ms) => { msg(t); box.classList.add('settled'); setTimeout(() => box.classList.add('gone'), ms); setTimeout(() => box.remove(), ms + 500); };
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('index.html?fresh=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    const latest = m ? m[1] : null;
    if (!latest || latest === APP_VERSION) { sessionStorage.removeItem('tabScrollerUpdate'); finish('Up to date', 900); return; }
    if (sessionStorage.getItem('tabScrollerUpdate') === latest) {   // tried once already: don't loop
      finish(`A new version (${latest}) is on GitHub but couldn't be loaded yet. Try again in a few minutes.`, 4000); return;
    }
    msg(`New version found: ${latest}. Downloading…`);
    for (const name of (await caches.keys()).filter(n => n.startsWith('tab-scroller'))) {
      const c = await caches.open(name);
      const page = () => new Response(text, { headers: { 'Content-Type': 'text/html; charset=utf-8' } });
      await c.put('./', page()); await c.put('./index.html', page());
    }
    sessionStorage.setItem('tabScrollerUpdate', latest);
    msg(`Updated to ${latest}. Restarting…`);
    setTimeout(() => location.reload(), 900);
  } catch (e) {
    finish(navigator.onLine ? 'Couldn’t reach GitHub. Using the saved version.' : 'Offline. Using the saved version.', 1600);
  }
}
</script>
